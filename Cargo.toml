[package]
name = "crater"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
libc = { version = "0.2.0" }
nix = { version = "0.31.0", features = ["process", "sched", "mount", "fs", "hostname"] }
tokio = { version = "1.52.0", features = ["rt-multi-thread"] }
rtnetlink = { version = "0.21.0" }
