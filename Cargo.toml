[package]
name = "crater"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["error"]

[dependencies]
error = { path = "./error" }
clap = { version = "4.6.0", features = ["derive"] }
libc = { version = "0.2.0" }
nix = { version = "0.31.0", features = ["process", "sched", "mount", "fs", "hostname"] }
rtnetlink = { version = "0.21.0" }
tokio = { version = "1.52.0", features = ["rt", "rt-multi-thread", "macros"] }
futures = { version = "0.3.0" }
serde = { version = "1.0.0", features = ["derive"] }
serde_json = { version = "1.0.0" }
